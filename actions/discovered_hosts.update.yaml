---
description: "Provision a discovered host (resource: PUT /api/v2/discovered_hosts/:id)"
enabled: true
runner_type: "python-script"
entry_point: lib/action.py
name: discovered_hosts.update
pack: foreman
parameters:
  operation:
    type: string
    default: discovered_hosts.update
    immutable: true
  connection:
    type: string
    description: "Name of <connection> from this pack's configuration that specifies how to connect to a server."
    required: false
  conn_server:
    type: string
    description: "Optional override of the server in <connection> (required if <connection> is not specified)."
    required: false
  conn_username:
    type: string
    description: "Optional override of the username in <connection> (example: username@domain.tld) (required if <connection> is not specified)."
    required: false
  conn_password:
    type: string
    description: "Optional override of the password in <connection>. (required if <connection> is not specified)"
    required: false
    secret: true
  location_id:
    type: number
    required: false
    description: "Set the current location context for the request"
  organization_id:
    type: number
    required: false
    description: "Set the current organization context for the request"
  id:
    type: string
    required: true
  discovered_host:
    type: object
    required: false
    description: >
       "description: 
        parameters:
            name:
              description: ''
              required: false
              type: string
            environment_id:
              description: required if host is managed and value is not inherited from host group
              required: false
              type: string
            ip:
              description: not required if using a subnet with DHCP Capsule
              required: false
              type: string
            mac:
              description: not required if it's a virtual machine
              required: false
              type: string
            architecture_id:
              description: required if host is managed and value is not inherited from host group
              required: false
              type: number
            domain_id:
              description: required if host is managed and value is not inherited from host group
              required: false
              type: number
            puppet_proxy_id:
              description: ''
              required: false
              type: number
            puppet_class_ids:
              description: ''
              required: false
              type: array
            operatingsystem_id:
              description: required if host is managed and value is not inherited from host group
              required: false
              type: number
            medium_id:
              description: required if not imaged based provisioning and host is managed and value is not inherited from host group
              required: false
              type: string
            ptable_id:
              description: required if host is managed and custom partition has not been defined
              required: false
              type: number
            subnet_id:
              description: required if host is managed and value is not inherited from host group
              required: false
              type: number
            sp_subnet_id:
              description: ''
              required: false
              type: number
            model_id:
              description: ''
              required: false
              type: number
            hostgroup_id:
              description: ''
              required: false
              type: number
            owner_id:
              description: ''
              required: false
              type: number
            owner_type:
              description: Host's owner type
              required: false
              type: string
            puppet_ca_proxy_id:
              description: ''
              required: false
              type: number
            image_id:
              description: ''
              required: false
              type: number
            host_parameters_attributes:
              description: Host's parameters (array or indexed hash)
              required: false
              type: array
              parameters:
                name:
                  description: Name of the parameter
                  required: false
                  type: string
                value:
                  description: Parameter value
                  required: false
                  type: string
                parameter_type:
                  description: Type of value
                  required: false
                  type: string
                hidden_value:
                  description: ''
                  required: false
                  type: boolean
            build:
              description: ''
              required: false
              type: boolean
            enabled:
              description: ''
              required: false
              type: boolean
            provision_method:
              description: ''
              required: false
              type: string
            managed:
              description: ''
              required: false
              type: boolean
            progress_report_id:
              description: UUID to track orchestration tasks status, GET /api/orchestration/:UUID/tasks
              required: false
              type: string
            capabilities:
              description: ''
              required: false
              type: string
            root_pass:
              description: required if value is not inherited from host group or default password in settings
              required: false
              type: string
            pxe_loader:
              description: DHCP filename option (Grub2 or PXELinux by default)
              required: false
              type: string
            "