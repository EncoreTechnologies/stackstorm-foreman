---
description: "Import a content view version (resource: POST /katello/api/content_imports/version)"
enabled: true
runner_type: "python-script"
entry_point: lib/action.py
name: content_imports.version
pack: foreman
parameters:
  operation:
    type: string
    default: content_imports.version
    immutable: true
  connection:
    type: string
    description: "Name of <connection> from this pack's configuration that specifies how to connect to a server."
    required: false
  conn_server:
    type: string
    description: "Optional override of the server in <connection> (required if <connection> is not specified)."
    required: false
  conn_username:
    type: string
    description: "Optional override of the username in <connection> (example: username@domain.tld) (required if <connection> is not specified)."
    required: false
  conn_password:
    type: string
    description: "Optional override of the password in <connection>. (required if <connection> is not specified)"
    required: false
    secret: true
  organization_id:
    type: number
    required: true
    description: "Organization identifier"
  path:
    type: string
    required: true
    description: "Directory containing the exported Content View Version"
  metadata:
    type: object
    required: true
    description: "Metadata taken from the upstream export history for this Content View Version"