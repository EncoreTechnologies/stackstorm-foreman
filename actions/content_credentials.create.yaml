---
description: "Create a Content Credential (resource: POST /katello/api/content_credentials)"
enabled: true
runner_type: "python-script"
entry_point: lib/action.py
name: content_credentials.create
pack: foreman
parameters:
  operation:
    type: string
    default: content_credentials.create
    immutable: true
  connection:
    type: string
    description: "Name of <connection> from this pack's configuration that specifies how to connect to a server."
    required: false
  conn_server:
    type: string
    description: "Optional override of the server in <connection> (required if <connection> is not specified)."
    required: false
  conn_username:
    type: string
    description: "Optional override of the username in <connection> (example: username@domain.tld) (required if <connection> is not specified)."
    required: false
  conn_password:
    type: string
    description: "Optional override of the password in <connection>. (required if <connection> is not specified)"
    required: false
    secret: true
  organization_id:
    type: number
    required: true
    description: "Organization identifier"
  name:
    type: string
    required: true
    description: "Name of the Content Credential"
  content_type:
    type: string
    required: true
    description: "Type of content: 'cert', 'gpg_key'"
  content:
    type: string
    required: true
    description: "Public key block in DER encoding or certificate content"