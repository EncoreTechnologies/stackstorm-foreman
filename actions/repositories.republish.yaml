---
description: "Forces a republish of the specified repository, regenerating metadata and symlinks on the filesystem. (resource: PUT /katello/api/repositories/:id/republish)"
enabled: true
runner_type: "python-script"
entry_point: lib/action.py
name: repositories.republish
pack: foreman
parameters:
  operation:
    type: string
    default: repositories.republish
    immutable: true
  connection:
    type: string
    description: "Name of <connection> from this pack's configuration that specifies how to connect to a server."
    required: false
  conn_server:
    type: string
    description: "Optional override of the server in <connection> (required if <connection> is not specified)."
    required: false
  conn_username:
    type: string
    description: "Optional override of the username in <connection> (example: username@domain.tld) (required if <connection> is not specified)."
    required: false
  conn_password:
    type: string
    description: "Optional override of the password in <connection>. (required if <connection> is not specified)"
    required: false
    secret: true
  id:
    type: number
    required: true
    description: "Repository identifier"
  force:
    type: boolean
    required: true
    description: "Force metadata regeneration to proceed.  Dangerous when repositories use the 'Complete Mirroring' mirroring policy."