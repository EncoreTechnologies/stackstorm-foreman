---
description: "Create a compute resource (resource: POST /api/compute_resources)"
enabled: true
runner_type: "python-script"
entry_point: lib/action.py
name: compute_resources.create
pack: foreman
parameters:
  operation:
    type: string
    default: compute_resources.create
    immutable: true
  connection:
    type: string
    description: "Name of <connection> from this pack's configuration that specifies how to connect to a server."
    required: false
  conn_server:
    type: string
    description: "Optional override of the server in <connection> (required if <connection> is not specified)."
    required: false
  conn_username:
    type: string
    description: "Optional override of the username in <connection> (example: username@domain.tld) (required if <connection> is not specified)."
    required: false
  conn_password:
    type: string
    description: "Optional override of the password in <connection>. (required if <connection> is not specified)"
    required: false
    secret: true
  location_id:
    type: number
    required: false
    description: "Set the current location context for the request"
  organization_id:
    type: number
    required: false
    description: "Set the current organization context for the request"
  compute_resource:
    type: object
    required: true
    description: >
       "description: 
        parameters:
            name:
              description: ''
              required: true
              type: string
            provider:
              description: Providers include Libvirt, Ovirt, EC2, Vmware, Openstack, GCE, AzureRm
              required: false
              type: string
            url:
              description: URL for Libvirt, RHEV and RHEL OpenStack Platform
              required: false
              type: string
            description:
              description: ''
              required: false
              type: string
            user:
              description: Username for RHEV, EC2, VMware, RHEL OpenStack Platform. Access Key for EC2.
              required: false
              type: string
            password:
              description: Password for RHEV, EC2, VMware, RHEL OpenStack Platform. Secret key for EC2
              required: false
              type: string
            datacenter:
              description: for RHEV, VMware Datacenter
              required: false
              type: string
            ovirt_quota:
              description: for RHEV only, ID or Name of quota to use
              required: false
              type: string
            public_key:
              description: for RHEV only
              required: false
              type: string
            region:
              description: for AzureRm eg. 'eastus' and for EC2 only. Use 'us-gov-west-1' for EC2 GovCloud region
              required: false
              type: string
            tenant:
              description: for RHEL OpenStack Platform and AzureRm only
              required: false
              type: string
            domain:
              description: for RHEL OpenStack Platform (v3) only
              required: false
              type: string
            project_domain_name:
              description: for RHEL OpenStack Platform (v3) only
              required: false
              type: string
            project_domain_id:
              description: for RHEL OpenStack Platform (v3) only
              required: false
              type: string
            server:
              description: for VMware
              required: false
              type: string
            set_console_password:
              description: for Libvirt and VMware only
              required: false
              type: boolean
            display_type:
              description: for Libvirt and RHEV only
              required: false
              type: string
            keyboard_layout:
              description: for RHEV only
              required: false
              type: string
            caching_enabled:
              description: enable caching, for VMware only
              required: false
              type: boolean
            project:
              description: Project id for GCE only
              required: false
              type: string
            email:
              description: Email for GCE only
              required: false
              type: string
            key_path:
              description: Certificate path for GCE only
              required: false
              type: string
            zone:
              description: for GCE only
              required: false
              type: string
            location_ids:
              description: REPLACE locations with given ids
              required: false
              type: array
            organization_ids:
              description: REPLACE organizations with given ids.
              required: false
              type: array
            app_ident:
              description: Client ID for AzureRm
              required: false
              type: string
            secret_key:
              description: Client Secret for AzureRm
              required: false
              type: string
            sub_id:
              description: Subscription ID for AzureRm
              required: false
              type: string
            cloud:
              description: Cloud
              required: false
              type: string
            "