---
description: "Performs a incremental-export of the repository in library. (resource: POST /katello/api/content_export_incrementals/repository)"
enabled: true
runner_type: "python-script"
entry_point: lib/action.py
name: content_export_incrementals.repository
pack: foreman
parameters:
  operation:
    type: string
    default: content_export_incrementals.repository
    immutable: true
  connection:
    type: string
    description: "Name of <connection> from this pack's configuration that specifies how to connect to a server."
    required: false
  conn_server:
    type: string
    description: "Optional override of the server in <connection> (required if <connection> is not specified)."
    required: false
  conn_username:
    type: string
    description: "Optional override of the username in <connection> (example: username@domain.tld) (required if <connection> is not specified)."
    required: false
  conn_password:
    type: string
    description: "Optional override of the password in <connection>. (required if <connection> is not specified)"
    required: false
    secret: true
  id:
    type: number
    required: true
    description: "Repository identifier"
  chunk_size_gb:
    type: number
    required: false
    description: "Split the exported content into archives no greater than the specified size in gigabytes."
  from_history_id:
    type: number
    required: false
    description: "Export history identifier used for incremental export. If not provided the most recent export history will be used."