---
description: "Create a medium (resource: POST /api/media)"
enabled: true
runner_type: "python-script"
entry_point: lib/action.py
name: media.create
pack: foreman
parameters:
  operation:
    type: string
    default: media.create
    immutable: true
  connection:
    type: string
    description: "Name of <connection> from this pack's configuration that specifies how to connect to a server."
    required: false
  server:
    type: string
    description: "Optional override of the server in <connection> (required if <connection> is not specified)."
    required: false
  conn_username:
    type: string
    description: "Optional override of the username in <connection> (example: username@domain.tld) (required if <connection> is not specified)."
    required: false
  conn_password:
    type: string
    description: "Optional override of the password in <connection>. (required if <connection> is not specified)"
    required: false
    secret: true
  location_id:
    type: number
    required: false
    description: "Set the current location context for the request"
  organization_id:
    type: number
    required: false
    description: "Set the current organization context for the request"
  medium:
    type: object
    required: true
    description: >
       "description: 
        parameters:
            name:
              description: Name of media
              required: true
              type: string
            path:
              description: The path to the medium, can be a URL or a valid NFS server (exclusive of the architecture).for example mirror.centos.org/centos/$version/os/$arch where $arch will be substituted for the host's actual OS architecture and $version, $major and $minor will be substituted for the version of the operating system.Solaris and Debian media may also use $release.
              required: true
              type: string
            os_family:
              description: 'Operating system family, available values: AIX, Altlinux, Archlinux, Coreos, Debian, Fcos, Freebsd, Gentoo, Junos, NXOS, Rancheros, Redhat, Rhcos, Solaris, Suse, VRP, Windows, Xenserver'
              required: false
              type: string
            operatingsystem_ids:
              description: ''
              required: false
              type: array
            location_ids:
              description: REPLACE locations with given ids
              required: false
              type: array
            organization_ids:
              description: REPLACE organizations with given ids.
              required: false
              type: array
            "