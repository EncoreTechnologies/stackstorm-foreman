---
description: "Update an SCAP content (resource: PUT /api/compliance/scap_contents/:id)"
enabled: true
runner_type: "python-script"
entry_point: lib/action.py
name: compliance.scap_contents_update
pack: foreman
parameters:
  operation:
    type: string
    default: compliance.scap_contents_update
    immutable: true
  connection:
    type: string
    description: "Name of <connection> from this pack's configuration that specifies how to connect to a server."
    required: false
  server:
    type: string
    description: "Optional override of the server in <connection> (required if <connection> is not specified)."
    required: false
  conn_username:
    type: string
    description: "Optional override of the username in <connection> (example: username@domain.tld) (required if <connection> is not specified)."
    required: false
  conn_password:
    type: string
    description: "Optional override of the password in <connection>. (required if <connection> is not specified)"
    required: false
    secret: true
  location_id:
    type: number
    required: false
    description: "Set the current location context for the request"
  organization_id:
    type: number
    required: false
    description: "Set the current organization context for the request"
  id:
    type: string
    required: true
  scap_content:
    type: object
    required: true
    description: >
       "description: 
        parameters:
            title:
              description: SCAP content name
              required: false
              type: string
            scap_file:
              description: XML containing SCAP content
              required: false
              type: string
            original_filename:
              description: Original file name of the XML file
              required: false
              type: string
            location_ids:
              description: REPLACE locations with given ids
              required: false
              type: array
            organization_ids:
              description: REPLACE organizations with given ids.
              required: false
              type: array
            "